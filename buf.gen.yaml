version: v2
plugins:
  # TypeScript: protobuf messages + service descriptors (protoc-gen-es v2 includes services)
  - remote: buf.build/bufbuild/es
    out: frontend/src/gen
    opt: target=js+dts
  # TypeScript: API endpoint
  - remote: buf.build/bufbuild/es
    out: api/.gen
    opt: target=js+dts
  # Go: protobuf messages — pinned to match the google.golang.org/protobuf version in go.mod
  - remote: buf.build/protocolbuffers/go:v1.36.11
    out: gen/go
    opt: paths=source_relative
  # Go: Connect service handlers — pinned to match the connectrpc.com/connect version in go.mod
  - remote: buf.build/connectrpc/go:v1.19.1
    out: gen/go
    opt: paths=source_relative
  # Python: protobuf messages
  - remote: buf.build/protocolbuffers/python
    out: gen/python
